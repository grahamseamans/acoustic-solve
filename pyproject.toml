# acoustic-solve is used from its checkout (the package reads pins.toml and the lock from the repository root, so a
# non-editable copy installed elsewhere would refuse to load): solver runs go through bin/blabrun (src/ on the path
# of the locked blab venv); client tooling depends on it as a uv path dependency with editable = true. Its
# dependencies are the blab venv's lock (venv/requirements.lock), not declared here.
[project]
name = "acoustic-solve"
version = "0.1.0"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
description = "Shared acoustic simulation tooling: the Boundary Lab + BEAT solver image, its pins, the blab venv, the pod-side solve, the room solver"
